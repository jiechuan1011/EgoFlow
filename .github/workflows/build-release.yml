name: 构建并发布 EgoFlow

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名称 (留空自动生成)'
        required: false
        type: string
      release_notes:
        description: '发布说明 (留空自动从 CHANGELOG 读取)'
        required: false
        type: string

# 权限设置：允许写入 releases
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle 缓存
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 设置 Android SDK
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      # 5. 解码签名证书
      - name: 解码签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > egoflow_keystore.jks
            echo "证书已解码"
          else
            echo "警告：未设置 KEYSTORE_BASE64，将使用 debug 签名"
          fi

      # 6. 自动递增版本号并生成发布名称
      - name: 递增版本号
        id: version
        run: |
          # 读取当前版本
          VERSION_CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'VERSION_NAME=' version.properties | cut -d'=' -f2)

          # 递增构建号
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          # 如果是 tag 推送 (v*)，使用 tag 作为版本名
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NEW_VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            NEW_VERSION_NAME="${{ inputs.version_name }}"
          else
            # 日期版本: 年.月.日-递增号
            NEW_VERSION_NAME="$(date +%Y.%m.%d)-beta.${NEW_VERSION_CODE}"
          fi

          # 写入新版本
          echo "VERSION_CODE=${NEW_VERSION_CODE}" > version.properties
          echo "VERSION_NAME=${NEW_VERSION_NAME}" >> version.properties

          echo "new_version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "new_version_name=${NEW_VERSION_NAME}" >> $GITHUB_OUTPUT

          echo "版本: ${NEW_VERSION_NAME} (build ${NEW_VERSION_CODE})"

      # 7. 授予 Gradle 执行权限并构建 release APK
      - name: 构建 Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/egoflow_keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            # 没有 gradlew wrapper 时自动生成
            gradle wrapper --gradle-version=8.5
            ./gradlew assembleRelease --no-daemon
          fi

      # 8. 收集 APK
      - name: 收集 APK 构建产物
        id: artifacts
        run: |
          mkdir -p artifacts
          # 查找所有 release APK
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          echo "apk_files=$(ls artifacts/)" >> $GITHUB_OUTPUT

      # 9. 生成发布说明
      - name: 生成发布说明
        id: release_notes
        run: |
          if [ -n "${{ inputs.release_notes }}" ]; then
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ -f CHANGELOG.md ]; then
            # 读取 CHANGELOG 中最新版本块的内容
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            sed -n '/^## /{//!q;}' CHANGELOG.md 2>/dev/null || head -50 CHANGELOG.md
            echo "" >> $GITHUB_OUTPUT
            echo "---" >> $GITHUB_OUTPUT
            echo "签名指纹 (SHA256):" >> $GITHUB_OUTPUT
            if [ -f egoflow_keystore.jks ]; then
              keytool -list -v -keystore egoflow_keystore.jks -alias ${{ secrets.KEY_ALIAS || 'egoflow' }} -storepass ${{ secrets.KEYSTORE_PASSWORD || 'egoflow_release' }} 2>/dev/null | grep 'SHA256:' >> $GITHUB_OUTPUT
            fi
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "NOTES=EgoFlow v${{ steps.version.outputs.new_version_name }} 发布构建" >> $GITHUB_OUTPUT
          fi

      # 10. 提交版本号变更
      - name: 提交版本号更新
        run: |
          git config user.name "EgoFlow CI"
          git config user.email "ci@egoflow.app"
          git add version.properties
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.new_version_name }} (build ${{ steps.version.outputs.new_version_code }})"
          git push origin HEAD:${{ github.ref_name }} || echo "推送版本号失败（可能无权限，忽略）"

      # 11. 创建 GitHub Release
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version_name }}
          name: EgoFlow v${{ steps.version.outputs.new_version_name }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. 上传 APK 作为 Actions 构建产物
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: EgoFlow-v${{ steps.version.outputs.new_version_name }}
          path: artifacts/*.apk
          if-no-files-found: error
